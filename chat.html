<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat ao Vivo — Sales Bot</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* Header */
  .header { background: #161b22; border-bottom: 1px solid #30363d; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  .header h1 { font-size: 16px; font-weight: 600; color: #f0f6fc; }
  .header .badge { background: #21262d; border: 1px solid #30363d; border-radius: 12px; padding: 3px 10px; font-size: 12px; color: #8b949e; }
  .header .badge.online { border-color: #238636; color: #3fb950; }
  #refresh-btn { margin-left: auto; background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  #refresh-btn:hover { background: #30363d; }

  /* Layout */
  .layout { display: flex; flex: 1; overflow: hidden; }

  /* Lista de conversas */
  .sidebar { width: 300px; border-right: 1px solid #30363d; overflow-y: auto; flex-shrink: 0; }
  .sidebar-header { padding: 12px 16px; border-bottom: 1px solid #30363d; font-size: 12px; color: #8b949e; text-transform: uppercase; letter-spacing: .5px; display: flex; justify-content: space-between; }
  .conv-item { padding: 12px 16px; border-bottom: 1px solid #21262d; cursor: pointer; transition: background .15s; }
  .conv-item:hover { background: #161b22; }
  .conv-item.active { background: #1c2128; border-left: 3px solid #388bfd; }
  .conv-item .conv-name { font-size: 13px; font-weight: 600; color: #f0f6fc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-item .conv-meta { font-size: 11px; color: #8b949e; margin-top: 3px; display: flex; gap: 8px; align-items: center; }
  .conv-item .conv-preview { font-size: 12px; color: #6e7681; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stage-badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .3px; }
  .stage-fechamento { background: #1f4a1f; color: #3fb950; }
  .stage-negociacao  { background: #2d2000; color: #d29922; }
  .stage-interesse   { background: #1a2d4a; color: #388bfd; }
  .stage-objecao     { background: #3a1a1a; color: #f85149; }
  .stage-primeiro_contato { background: #1c1c1c; color: #8b949e; }
  .stage-onboarding  { background: #1f3a2d; color: #56d364; }
  .stage-em_producao { background: #1a2a3a; color: #79c0ff; }
  .stage-entregue    { background: #1a2d1a; color: #56d364; }
  .stage-encerrado   { background: #1c1c1c; color: #484f58; }

  /* Painel de mensagens */
  .chat-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .chat-header { padding: 12px 20px; border-bottom: 1px solid #30363d; background: #161b22; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .chat-header .chat-name { font-size: 15px; font-weight: 600; color: #f0f6fc; }
  .chat-header .chat-info { font-size: 12px; color: #8b949e; }
  .chat-header .take-over-btn { margin-left: auto; background: #1f4a1f; border: 1px solid #238636; color: #3fb950; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
  .chat-header .take-over-btn:hover { background: #238636; color: #fff; }

  .messages { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 72%; padding: 8px 12px; border-radius: 12px; font-size: 13px; line-height: 1.5; }
  .msg.lead { align-self: flex-start; background: #21262d; border: 1px solid #30363d; color: #c9d1d9; border-bottom-left-radius: 3px; }
  .msg.victor { align-self: flex-end; background: #1f4a1f; border: 1px solid #238636; color: #d2f0d2; border-bottom-right-radius: 3px; }
  .msg .msg-time { font-size: 10px; color: #6e7681; margin-top: 4px; text-align: right; }
  .msg.lead .msg-time { text-align: left; }
  .msg .msg-role { font-size: 10px; font-weight: 600; margin-bottom: 3px; }
  .msg.lead .msg-role { color: #388bfd; }
  .msg.victor .msg-role { color: #56d364; }

  .empty-state { flex: 1; display: flex; align-items: center; justify-content: center; color: #484f58; flex-direction: column; gap: 8px; }
  .empty-state .icon { font-size: 40px; }

  /* Input */
  .input-area { padding: 12px 16px; border-top: 1px solid #30363d; background: #161b22; display: flex; gap: 10px; flex-shrink: 0; }
  .input-area textarea { flex: 1; background: #21262d; border: 1px solid #30363d; border-radius: 8px; color: #c9d1d9; padding: 8px 12px; font-size: 13px; resize: none; font-family: inherit; line-height: 1.4; max-height: 100px; }
  .input-area textarea:focus { outline: none; border-color: #388bfd; }
  .input-area textarea::placeholder { color: #484f58; }
  .send-btn { background: #238636; border: none; color: #fff; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; align-self: flex-end; }
  .send-btn:hover { background: #2ea043; }
  .send-btn:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }

  .loading { color: #8b949e; font-size: 12px; text-align: center; padding: 20px; }
</style>
</head>
<body>

<div class="header">
  <h1>💬 Chat ao Vivo</h1>
  <span class="badge" id="status-badge">carregando...</span>
  <span class="badge" id="conv-count"></span>
  <button id="refresh-btn" onclick="loadConversas()">↺ Atualizar</button>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-header">
      <span>Conversas ativas</span>
      <span id="sidebar-count">0</span>
    </div>
    <div id="conv-list"><div class="loading">Carregando...</div></div>
  </div>

  <div class="chat-panel">
    <div id="chat-header" class="chat-header" style="display:none">
      <div>
        <div class="chat-name" id="chat-name">—</div>
        <div class="chat-info" id="chat-info">—</div>
      </div>
      <button class="take-over-btn" onclick="assumirConversa()">🎯 Assumir conversa</button>
    </div>
    <div class="messages" id="messages">
      <div class="empty-state">
        <div class="icon">💬</div>
        <div>Selecione uma conversa</div>
      </div>
    </div>
    <div class="input-area" id="input-area" style="display:none">
      <textarea id="msg-input" placeholder="Digite uma mensagem manual (você estará respondendo como Victor)..." rows="2"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();enviarMensagem();}"></textarea>
      <button class="send-btn" id="send-btn" onclick="enviarMensagem()">Enviar</button>
    </div>
  </div>
</div>

<script>
let conversas = [];
let selectedPhone = null;
let autoRefresh = null;

const STAGE_LABELS = {
  primeiro_contato: 'Primeiro contato',
  interesse: 'Interesse',
  negociacao: 'Negociação',
  fechamento: 'Fechamento',
  objecao: 'Objeção',
  onboarding: 'Onboarding',
  em_producao: 'Em produção',
  entregue: 'Entregue',
  encerrado: 'Encerrado',
};

function stageBadge(s) {
  return `<span class="stage-badge stage-${s}">${STAGE_LABELS[s] || s}</span>`;
}

function timeAgo(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'agora';
  if (m < 60) return `${m}min atrás`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h atrás`;
  return `${Math.floor(h / 24)}d atrás`;
}

function formatTime(iso) {
  return new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

async function loadConversas() {
  try {
    const r = await fetch('/api/chat/conversas');
    conversas = await r.json();
    renderSidebar();
    document.getElementById('status-badge').textContent = 'online';
    document.getElementById('status-badge').className = 'badge online';
    document.getElementById('conv-count').textContent = `${conversas.length} ativas`;
    document.getElementById('sidebar-count').textContent = conversas.length;
    if (selectedPhone) {
      const updated = conversas.find(c => c.phone === selectedPhone);
      if (updated) renderMessages(updated);
    }
  } catch {
    document.getElementById('status-badge').textContent = 'offline';
    document.getElementById('status-badge').className = 'badge';
  }
}

function renderSidebar() {
  const list = document.getElementById('conv-list');
  if (!conversas.length) { list.innerHTML = '<div class="loading">Nenhuma conversa ativa</div>'; return; }
  list.innerHTML = conversas.map(c => {
    const ultima = c.ultima_mensagem;
    const preview = ultima ? `${ultima.role === 'victor' ? '🤖 ' : ''}${ultima.texto.slice(0, 60)}` : 'Sem mensagens';
    const active = c.phone === selectedPhone ? ' active' : '';
    return `<div class="conv-item${active}" onclick="selectConv('${c.phone}')">
      <div class="conv-name">${c.nome_negocio}</div>
      <div class="conv-meta">${stageBadge(c.estagio)} <span>${c.cidade || ''}</span> <span style="margin-left:auto">${timeAgo(c.ultima_atualizacao)}</span></div>
      <div class="conv-preview">${preview}</div>
    </div>`;
  }).join('');
}

function selectConv(phone) {
  selectedPhone = phone;
  const c = conversas.find(x => x.phone === phone);
  if (!c) return;
  renderSidebar();
  renderMessages(c);
  document.getElementById('chat-header').style.display = 'flex';
  document.getElementById('input-area').style.display = 'flex';
  document.getElementById('chat-name').textContent = c.nome_negocio;
  document.getElementById('chat-info').textContent = `${c.segmento || '—'} • ${c.cidade || '—'} • ${c.phone}`;
}

function renderMessages(c) {
  const container = document.getElementById('messages');
  if (!c.mensagens || !c.mensagens.length) {
    container.innerHTML = '<div class="empty-state"><div>Sem mensagens</div></div>';
    return;
  }
  container.innerHTML = c.mensagens.map(m => `
    <div class="msg ${m.role}">
      <div class="msg-role">${m.role === 'victor' ? '🤖 Bot (Victor)' : '👤 ' + c.nome_negocio}</div>
      <div>${m.texto.replace(/\n/g, '<br>').replace(/\*(.*?)\*/g, '<strong>$1</strong>')}</div>
      <div class="msg-time">${formatTime(m.data)}</div>
    </div>
  `).join('');
  container.scrollTop = container.scrollHeight;
}

async function enviarMensagem() {
  const input = document.getElementById('msg-input');
  const btn = document.getElementById('send-btn');
  const text = input.value.trim();
  if (!text || !selectedPhone) return;
  btn.disabled = true;
  btn.textContent = 'Enviando...';
  try {
    const r = await fetch('/api/chat/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: selectedPhone, message: text }),
    });
    const data = await r.json();
    if (data.success) {
      input.value = '';
      await loadConversas();
    } else {
      alert('Falha ao enviar: ' + (data.error || 'erro desconhecido'));
    }
  } catch (e) {
    alert('Erro de rede: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Enviar';
  }
}

function assumirConversa() {
  if (!selectedPhone) return;
  const c = conversas.find(x => x.phone === selectedPhone);
  if (!c) return;
  document.getElementById('msg-input').focus();
  document.getElementById('msg-input').placeholder =
    `Respondendo manualmente para ${c.nome_negocio}. O bot NÃO vai substituir esta mensagem.`;
}

// Auto-refresh a cada 30s
loadConversas();
autoRefresh = setInterval(loadConversas, 30000);
</script>
</body>
</html>
