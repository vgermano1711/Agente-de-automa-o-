  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #2980b9;
      --primary-dark: #1a6fa3;
      --primary-light: #3d9ad1;
      --bg: #eaf4fb;
      --white: #ffffff;
      --text-dark: #1a2b3c;
      --text-mid: #3a5068;
      --text-light: #6b8fa8;
      --accent: #27ae60;
      --accent-dark: #1e9451;
      --shadow-soft: 0 4px 24px rgba(41, 128, 185, 0.12);
      --shadow-card: 0 2px 16px rgba(41, 128, 185, 0.10);
      --radius: 14px;
      --radius-sm: 8px;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

      color: var(--text-dark);
      line-height: 1.6;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── HEADER ─── */
    header {
      background: var(--white);
      border-bottom: 2px solid rgba(41, 128, 185, 0.10);
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(41, 128, 185, 0.08);
    }

    .header-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .logo {

      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .logo-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .logo-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.3px;
    }

    .logo-sub {
      font-size: 11px;
      color: var(--text-light);
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    .header-badge {
      background: linear-gradient(135deg, #fff7e6, #ffecd0);
      border: 1px solid #f0a500;
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      color: #b07800;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ─── HERO ─── */
    .hero {
      background: linear-gradient(160deg, var(--primary-dark) 0%, var(--primary) 50%, var(--primary-light) 100%);
      padding: 60px 20px 70px;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -60px;
      width: 280px;
      height: 280px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: -80px;
      left: -40px;
      width: 200px;
      height: 200px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 50%;
    }

    .hero-inner {
      max-width: 680px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.92);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .hero h1 {
      font-size: clamp(26px, 6vw, 44px);
      font-weight: 800;
      color: var(--white);
      line-height: 1.2;
      letter-spacing: -0.8px;
      margin-bottom: 18px;
    }

    .hero h1 span {
      color: #ffd166;
    }

    .hero-sub {
      font-size: clamp(15px, 3.5vw, 18px);
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.65;
      margin-bottom: 36px;
      max-width: 520px;
    }

    .hero-actions {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: flex-start;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--accent);
      color: var(--white);
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      padding: 16px 32px;
      border-radius: 50px;
      box-shadow: 0 6px 24px rgba(39, 174, 96, 0.40);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      width: 100%;
      max-width: 340px;
      letter-spacing: 0.2px;
    }

    .btn-primary:active {
      transform: scale(0.97);
    }

    .btn-icon {
      font-size: 20px;
      flex-shrink: 0;
    }

    .hero-trust {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    .stars {
      color: #ffd166;
      font-size: 15px;
      letter-spacing: 1px;
    }

    .hero-trust-text {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.80);
    }

    .hero-trust-text strong {
      color: rgba(255, 255, 255, 0.98);
    }

    /* ─── SOCIAL PROOF STRIP ─── */
    .proof-strip {
      background: var(--white);
      padding: 18px 20px;
      border-bottom: 1px solid rgba(41, 128, 185, 0.08);
    }

    .proof-strip-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 16px 28px;
      justify-content: center;
    }

    .proof-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: var(--text-mid);
      font-weight: 500;
    }

    .proof-dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ─── SECTIONS COMMONS ─── */
    section {
      padding: 56px 20px;
    }

    .section-inner {
      max-width: 900px;
      margin: 0 auto;
    }

    .section-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--primary);
      margin-bottom: 10px;
    }

    .section-title {
      font-size: clamp(22px, 5vw, 34px);
      font-weight: 800;
      color: var(--text-dark);
      line-height: 1.25;
      letter-spacing: -0.5px;
      margin-bottom: 14px;
    }

    .section-title span {
      color: var(--primary);
    }

    .section-desc {
      font-size: 16px;
      color: var(--text-mid);
      line-height: 1.7;
      max-width: 580px;
    }

    /* ─── SOBRE / PROBLEMA ─── */
    .sobre {
      background: var(--white);
    }

    .sobre-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 40px;
      margin-top: 40px;
    }

    .sobre-text p {
      font-size: 15px;
      color: var(--text-mid);
      line-height: 1.75;
      margin-bottom: 14px;
    }

    .sobre-text p:last-child {
      margin-bottom: 0;
    }

    .sobre-text strong {
      color: var(--text-dark);
    }

    .highlight-box {
      background: linear-gradient(135deg, var(--bg) 0%, rgba(41, 128, 185, 0.06) 100%);
      border-left: 4px solid var(--primary);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: 18px 20px;
      margin-top: 22px;
    }

    .highlight-box p {
      font-size: 15px;
      color: var(--text-dark);
      font-weight: 600;
      line-height: 1.55;
      margin: 0 !important;
    }

    /* ─── SERVIÇOS ─── */
    .servicos {
      background: var(--bg);
    }

    .servicos-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-top: 36px;
    }

    .servico-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 22px 20px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
      box-shadow: var(--shadow-card);
      border: 1px solid rgba(41, 128, 185, 0.07);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .servico-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--bg), rgba(41, 128, 185, 0.12));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
      border: 1px solid rgba(41, 128, 185, 0.12);
    }

    .servico-content h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 6px;
      letter-spacing: -0.2px;
    }

    .servico-content p {
      font-size: 14px;
      color: var(--text-mid);
      line-height: 1.6;
    }

    }

      background: linear-gradient(160deg, #f5fbff 0%, var(--white) 100%);

      background: linear-gradient(90deg, var(--primary), var(--primary-light));
    }

    .diferencial-number {
      font-size: 48px;

      color: rgba(41, 128, 185, 0.10);
      line-height: 1;
      position: absolute;

      right: 20px;
      letter-spacing: -2px;
    }

    .diferencial-icon-wrap {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-radius: 14px;

      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 18px;
      box-shadow: 0 4px 14px rgba(41, 128, 185, 0.30);
    }

      color: var(--text-dark);

      letter-spacing: -0.3px;
      line-height: 1.3;
