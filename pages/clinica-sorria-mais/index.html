<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Clínica Sorria Mais em Campinas, SP. Odontologia completa com atendimento humanizado. Agende sua consulta agora pelo WhatsApp.">
<title>Clínica Sorria Mais — Odontologia em Campinas, SP</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --primary: #2980b9;
    --primary-dark: #1f6391;
    --primary-light: #3498db;
    --bg: #eaf4fb;
    --white: #ffffff;
    --text-dark: #1a2a3a;
    --text-mid: #3d5166;
    --text-light: #6b8a9e;
    --accent: #27ae60;
    --accent-dark: #1e8449;
    --border-light: #c9e2f5;
    --shadow: 0 4px 24px rgba(41,128,185,0.13);
    --radius: 14px;
    --radius-sm: 8px;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text-dark);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  img {
    max-width: 100%;
    display: block;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  /* ── HEADER ── */
  .header {
    background: var(--white);
    border-bottom: 2px solid var(--border-light);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(41,128,185,0.08);
  }

  .header-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-icon {
    width: 40px;
    height: 40px;
    background: var(--primary);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .logo-icon svg {
    width: 22px;
    height: 22px;
    fill: var(--white);
  }

  .logo-text {
    display: flex;
    flex-direction: column;
    line-height: 1.2;
  }

  .logo-name {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--primary-dark);
    letter-spacing: -0.3px;
  }

  .logo-sub {
    font-size: 0.7rem;
    color: var(--text-light);
    font-weight: 500;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .header-cta {
    background: var(--accent);
    color: var(--white);
    padding: 9px 18px;
    border-radius: 50px;
    font-size: 0.82rem;
    font-weight: 700;
    white-space: nowrap;
    transition: background 0.2s, transform 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .header-cta:hover {
    background: var(--accent-dark);
    transform: translateY(-1px);
  }

  .header-cta svg {
    width: 15px;
    height: 15px;
    fill: var(--white);
  }

  /* ── HERO ── */
  .hero {
    background: linear-gradient(145deg, #1a5f8a 0%, var(--primary) 50%, #3ab0e0 100%);
    color: var(--white);
    padding: 60px 20px 70px;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -80px;
    right: -80px;
    width: 320px;
    height: 320px;
    background: rgba(255,255,255,0.04);
    border-radius: 50%;
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: -60px;
    left: -60px;
    width: 240px;
    height: 240px;
    background: rgba(255,255,255,0.05);
    border-radius: 50%;
  }

  .hero-inner {
    max-width: 700px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
    text-align: center;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 50px;
    padding: 6px 16px;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.4px;
    margin-bottom: 24px;
    backdrop-filter: blur(4px);
  }

  .hero-badge svg {
    width: 14px;
    height: 14px;
    fill: #ffd700;
  }

  .hero-headline {
    font-size: clamp(1.75rem, 5vw, 2.6rem);
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: -0.5px;
    margin-bottom: 18px;
  }

  .hero-headline span {
    color: #ffe066;
  }

  .hero-sub {
    font-size: clamp(0.95rem, 2.5vw, 1.1rem);
    color: rgba(255,255,255,0.88);
    line-height: 1.65;
    margin-bottom: 36px;
    max-width: 520px;
    margin-left: auto;
    margin-right: auto;
  }

  .hero-actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .btn-whatsapp-hero {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--accent);
    color: var(--white);
    padding: 17px 36px;
    border-radius: 50px;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.2px;
    box-shadow: 0 6px 24px rgba(39,174,96,0.4);
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    width: 100%;
    max-width: 360px;
  }

  .btn-whatsapp-hero:hover {
    background: var(--accent-dark);
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(39,174,96,0.45);
  }

  .btn-whatsapp-hero svg {
    width: 22px;
    height: 22px;
    fill: var(--white);
    flex-shrink: 0;
  }

  .hero-note {
    font-size: 0.78rem;
    color: rgba(255,255,255,0.65);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }

  .hero-note svg {
    width: 13px;
    height: 13px;
    fill: rgba(255,255,255,0.65);
  }

  /* ── SOCIAL PROOF STRIP ── */
  .proof-strip {
    background: var(--white);
    padding: 20px;
    border-bottom: 1px solid var(--border-light);
  }

  .proof-strip-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 20px 36px;
  }

  .proof-item {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .proof-icon {
    width: 38px;
    height: 38px;
    background: var(--bg);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .proof-icon svg {
    width: 18px;
    height: 18px;
    fill: var(--primary);
  }

  .proof-text strong {
    display: block;
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-dark);
    line-height: 1.2;
  }

  .proof-text span {
    font-size: 0.74rem;
    color: var(--text-light);
    font-weight: 500;
  }

  .proof-divider {
    width: 1px;
    height: 36px;
    background: var(--border-light);
  }

  /* ── SECTION WRAPPER ── */
  .section {
    padding: 60px 20px;
  }

  .section-inner {
    max-width: 1100px;
    margin: 0 auto;
  }

  .section-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--primary);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-label::before {
    content: '';
    display: inline-block;
    width: 20px;
    height: 2px;
    background: var(--primary);
    border-radius: 2px;
  }

  .section-title {
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 800;
    line-height: 1.25;
    letter-spacing: -0.4px;
    color: var(--text-dark);
    margin-bottom: 14px;
  }

  .section-desc {
    font-size: 0.97rem;
    color: var(--text-mid);
    line-height: 1.7;
    max-width: 560px;
  }

  /* ── SOBRE ── */
  .about {
    background: var(--white);
  }

  .about-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 40px;
    align-items: center;
  }

  .about-visual {
    background: linear-gradient(135deg, var(--bg) 0%, #c8e6f7 100%);
    border-radius: var(--radius);
    padding: 36px 28px;
    border: 1px solid var(--border-light);
    position: relative;
    overflow: hidden;
  }

  .about-visual::after {
    content: '';
    position: absolute;
    bottom: -30px;
    right: -30px;
    width: 120px;
    height: 120px;
    background: rgba(41,128,185,0.08);
    border-radius: 50%;
  }

  .about-visual-icon {
    width: 64px;
    height: 64px;
    background: var(--primary);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
  }

  .about-visual-icon svg {
    width: 32px;
    height: 32px;
    fill: var(--white);
  }

  .about-visual-title {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--text-dark);
    margin-bottom: 8px;
  }

  .about-visual-text {
    font-size: 0.9rem;
    color: var(--text-mid);
    line-height: 1.65;
  }

  .about-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-top: 24px;
  }

  .stat-box {
    background: var(--white);
    border-radius: var(--radius-sm);
    padding: 16px 14px;
    border: 1px solid var(--border-light);
    text-align: center;
    box-shadow: 0 2px 8px rgba(41,128,185,0.06);
  }

  .stat-number {
    font-size: 1.55rem;
    font-weight: 800;
    color: var(--primary);
    display: block;
    line-height: 1.1;
    margin-bottom: 4px;
  }

  .stat-label {
    font-size: 0.72rem;
    color: var(--text-light);
    font-weight: 600;
    letter-spacing: 0.2px;
  }

  /* ── SERVIÇOS ── */
  .services {
    background: var(--bg);
  }

  .services-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    margin-top: 36px;
  }

  .service-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 24px 22px;
    border: 1px solid var(--border-light);
    display: flex;
    align-items: flex-start;
    gap: 18px;
    box-shadow: 0 2px 12px rgba(41,128,185,0.05);
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .service-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow);
  }

  .service-emoji {
    font-size: 2rem;
    line-height: 1;
    flex-shrink: 0;
    width: 44px;
    text-align: center;
  }

  .service-info h3 {
    font-
