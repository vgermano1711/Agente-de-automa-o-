<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Salão da Dona Maria em São Paulo — Cabelo, beleza e cuidado de verdade. Agende pelo WhatsApp agora mesmo." />
  <title>Salão da Dona Maria — São Paulo, SP</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #c06b8a;
      --primary-dark: #a3547200;
      --primary-deep: #9e4d6e;
      --bg: #f9e8f0;
      --bg-card: #ffffff;
      --text-dark: #2a1a22;
      --text-mid: #5a3a4a;
      --text-light: #8a6070;
      --accent: #f4c2d8;
      --accent-soft: #fdf0f5;
      --white: #ffffff;
      --shadow: 0 4px 24px rgba(192, 107, 138, 0.12);
      --shadow-hover: 0 8px 40px rgba(192, 107, 138, 0.25);
      --radius: 16px;
      --radius-sm: 10px;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-dark);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ===================== HEADER / NAV ===================== */
    header {
      background: var(--white);
      border-bottom: 1px solid rgba(192, 107, 138, 0.12);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 16px rgba(192, 107, 138, 0.08);
    }

    .nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--primary), var(--primary-deep));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .logo-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .logo-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-dark);
      letter-spacing: -0.3px;
    }

    .logo-sub {
      font-size: 11px;
      color: var(--primary);
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .nav-cta {
      background: var(--primary);
      color: var(--white);
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.2s, transform 0.2s;
      white-space: nowrap;
    }

    .nav-cta:hover {
      background: var(--primary-deep);
      transform: translateY(-1px);
    }

    /* ===================== HERO ===================== */
    .hero {
      background: linear-gradient(160deg, var(--white) 0%, var(--bg) 60%, var(--accent) 100%);
      padding: 64px 20px 72px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -80px;
      right: -80px;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(192, 107, 138, 0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: -60px;
      left: -60px;
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, rgba(244, 194, 216, 0.3) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(192, 107, 138, 0.1);
      border: 1px solid rgba(192, 107, 138, 0.2);
      color: var(--primary-deep);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 50px;
      margin-bottom: 24px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .hero h1 {
      font-size: clamp(28px, 7vw, 52px);
      font-weight: 800;
      color: var(--text-dark);
      line-height: 1.15;
      letter-spacing: -1px;
      margin-bottom: 20px;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
    }

    .hero h1 span {
      color: var(--primary);
      display: inline;
    }

    .hero-sub {
      font-size: clamp(15px, 4vw, 18px);
      color: var(--text-mid);
      max-width: 520px;
      margin: 0 auto 36px;
      line-height: 1.7;
    }

    .hero-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, var(--primary), var(--primary-deep));
      color: var(--white);
      text-decoration: none;
      padding: 16px 32px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 6px 28px rgba(192, 107, 138, 0.35);
      transition: transform 0.2s, box-shadow 0.2s;
      letter-spacing: -0.2px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 36px rgba(192, 107, 138, 0.45);
    }

    .btn-secondary {
      color: var(--text-mid);
      font-size: 14px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .btn-secondary:hover {
      color: var(--primary);
    }

    .hero-trust {
      margin-top: 48px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px 32px;
    }

    .trust-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-light);
      font-weight: 500;
    }

    .trust-dot {
      width: 8px;
      height: 8px;
      background: var(--primary);
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ===================== SOBRE ===================== */
    .section {
      padding: 72px 20px;
    }

    .section-inner {
      max-width: 1100px;
      margin: 0 auto;
    }

    .section-label {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--primary);
      margin-bottom: 12px;
    }

    .section-title {
      font-size: clamp(22px, 5vw, 36px);
      font-weight: 800;
      color: var(--text-dark);
      line-height: 1.2;
      letter-spacing: -0.5px;
      margin-bottom: 16px;
    }

    .section-title span {
      color: var(--primary);
    }

    .section-desc {
      font-size: 15px;
      color: var(--text-mid);
      line-height: 1.75;
      max-width: 560px;
    }

    .sobre-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 40px;
      align-items: center;
    }

    .sobre-visual {
      background: linear-gradient(135deg, var(--primary) 0%, #e8a0bc 100%);
      border-radius: 24px;
      padding: 40px 32px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .sobre-visual::before {
      content: '';
      position: absolute;
      top: -30px;
      right: -30px;
      width: 120px;
      height: 120px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
    }

    .sobre-visual::after {
      content: '';
      position: absolute;
      bottom: -20px;
      left: -20px;
      width: 80px;
      height: 80px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
    }

    .sobre-emoji {
      font-size: 64px;
      display: block;
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
    }

    .sobre-visual-text {
      color: var(--white);
      font-size: 18px;
      font-weight: 700;
      position: relative;
      z-index: 1;
      line-height: 1.3;
    }

    .sobre-visual-sub {
      color: rgba(255,255,255,0.8);
      font-size: 13px;
      margin-top: 6px;
      position: relative;
      z-index: 1;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 32px;
    }

    .stat-card {
      background: var(--white);
      border-radius: var(--radius-sm);
      padding: 20px 12px;
      text-align: center;
      box-shadow: var(--shadow);
      border: 1px solid rgba(192, 107, 138, 0.08);
    }

    .stat-number {
      font-size: 26px;
      font-weight: 800;
      color: var(--primary);
      line-height: 1;
      display: block;
      letter-spacing: -1px;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-light);
      margin-top: 4px;
      font-weight: 500;
    }

    /* ===================== SERVIÇOS ===================== */
    .servicos {
      background: var(--white);
    }

    .servicos-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-top: 40px;
    }

    .servico-card {
      background: var(--accent-soft);
      border: 1px solid rgba(192, 107, 138, 0.1);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      align-items: flex-start;
      gap: 18px;
      transition: box-shadow 0.2s, transform 0.2s;
    }

    .servico-card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .servico-icon {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, var(--primary), #e8a0bc);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .servico-info h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 6px;
    }

    .servico-info p {
      font-size: 14px;
      color: var(--text-light);
      line-height: 1.6;
    }

    .servico-tag {
      display: inline-block;
      background: rgba(192, 107, 138, 0.1);
      color: var(--primary-deep);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 50px;
      margin-top: 8px;
    }

    /* ===================== DIFERENCIAIS ===================== */
    .diferenciais {
      background: var(--bg);
    }

    .dif-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-top: 40px;
    }

    .dif-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 32px 28px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(192, 107, 138, 0.08);
      position: relative;
      overflow: hidden;
      transition: box-shadow 0.2s, transform 0.2s;
    }

    .dif-card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-3px);
    }

    .dif-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(180deg, var(--primary), var(--accent));
      border
