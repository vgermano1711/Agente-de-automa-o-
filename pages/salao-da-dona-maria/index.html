<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Salão da Dona Maria — Beleza e cuidado em São Paulo, SP. Cortes, coloração, tratamentos e muito mais. Agende seu horário pelo WhatsApp." />
  <title>Salão da Dona Maria — São Paulo, SP</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #c06b8a;
      --primary-dark: #a3556f;
      --primary-light: #d48aa6;
      --bg: #f9e8f0;
      --bg-card: #ffffff;
      --text-dark: #2c1a22;
      --text-mid: #5a3a48;
      --text-light: #8a6070;
      --accent: #f0c4d8;
      --white: #ffffff;
      --shadow: 0 4px 24px rgba(192, 107, 138, 0.12);
      --radius: 16px;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background-color: var(--bg);
      color: var(--text-dark);
      line-height: 1.6;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── TIPOGRAFIA UTILITÁRIA ─── */
    .sans {
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    /* ─── HEADER / NAV ─── */
    header {
      background: var(--white);
      border-bottom: 1px solid var(--accent);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(192, 107, 138, 0.08);
    }

    .logo {
      display: flex;
      flex-direction: column;
    }

    .logo-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.02em;
      line-height: 1.2;
    }

    .logo-tagline {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.65rem;
      color: var(--text-light);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .header-cta {
      background: var(--primary);
      color: var(--white);
      text-decoration: none;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 50px;
      letter-spacing: 0.04em;
      transition: background 0.2s ease, transform 0.1s ease;
      white-space: nowrap;
    }

    .header-cta:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    /* ─── HERO ─── */
    .hero {
      background: linear-gradient(150deg, #fff0f6 0%, var(--bg) 50%, #f5dde9 100%);
      padding: 56px 20px 60px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -60px;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(192,107,138,0.12) 0%, transparent 70%);
      border-radius: 50%;
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: -40px;
      left: -40px;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(192,107,138,0.1) 0%, transparent 70%);
      border-radius: 50%;
    }

    .hero-badge {
      display: inline-block;
      background: var(--accent);
      color: var(--primary-dark);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 50px;
      margin-bottom: 24px;
    }

    .hero h1 {
      font-size: 2rem;
      line-height: 1.2;
      color: var(--text-dark);
      margin-bottom: 20px;
      max-width: 360px;
      margin-left: auto;
      margin-right: auto;
    }

    .hero h1 em {
      font-style: italic;
      color: var(--primary);
    }

    .hero-sub {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 1rem;
      color: var(--text-mid);
      max-width: 340px;
      margin: 0 auto 36px;
      line-height: 1.7;
    }

    .hero-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--primary);
      color: var(--white);
      text-decoration: none;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 1rem;
      font-weight: 700;
      padding: 16px 32px;
      border-radius: 50px;
      letter-spacing: 0.02em;
      transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 6px 20px rgba(192, 107, 138, 0.35);
      width: 100%;
      max-width: 320px;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(192, 107, 138, 0.45);
    }

    .btn-secondary {
      display: inline-block;
      color: var(--primary);
      text-decoration: none;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 4px 0;
      border-bottom: 2px solid var(--accent);
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    .btn-secondary:hover {
      border-color: var(--primary);
      color: var(--primary-dark);
    }

    .hero-social-proof {
      margin-top: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .proof-avatars {
      display: flex;
    }

    .proof-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--white);
      background: linear-gradient(135deg, var(--primary-light), var(--primary-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: var(--white);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-weight: 700;
      margin-right: -8px;
    }

    .proof-text {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.8rem;
      color: var(--text-mid);
      line-height: 1.4;
    }

    .proof-text strong {
      color: var(--text-dark);
      display: block;
    }

    /* ─── SEÇÃO SOBRE ─── */
    .section-sobre {
      background: var(--white);
      padding: 60px 20px;
    }

    .section-label {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 10px;
      display: block;
    }

    .section-title {
      font-size: 1.6rem;
      line-height: 1.25;
      color: var(--text-dark);
      margin-bottom: 16px;
    }

    .section-desc {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.95rem;
      color: var(--text-mid);
      line-height: 1.75;
      margin-bottom: 36px;
    }

    .sobre-destaque {
      background: linear-gradient(135deg, var(--bg) 0%, #f5dde9 100%);
      border-left: 4px solid var(--primary);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: 20px;
      margin-bottom: 36px;
    }

    .sobre-destaque p {
      font-style: italic;
      font-size: 1rem;
      color: var(--text-mid);
      line-height: 1.65;
    }

    .sobre-destaque p strong {
      color: var(--primary-dark);
      font-style: normal;
    }

    /* ─── SERVIÇOS ─── */
    .services-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .service-card {
      background: var(--bg);
      border-radius: var(--radius);
      padding: 18px 14px;
      text-align: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .service-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
    }

    .service-icon {
      font-size: 1.8rem;
      margin-bottom: 8px;
      display: block;
    }

    .service-name {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-dark);
      line-height: 1.3;
    }

    .service-desc {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.72rem;
      color: var(--text-light);
      margin-top: 4px;
      line-height: 1.4;
    }

    /* ─── DIFERENCIAIS ─── */
    .section-diferenciais {
      background: var(--bg);
      padding: 60px 20px;
    }

    .diferenciais-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 32px;
    }

    .diferencial-card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 28px 24px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .diferencial-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(180deg, var(--primary), var(--primary-light));
    }

    .diferencial-number {
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 12px;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    .diferencial-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 8px;
    }

    .diferencial-text {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.88rem;
      color: var(--text-mid);
      line-height: 1.7;
    }

    /* ─── DEPOIMENTOS ─── */
    .section-depoimentos {
      background: linear-gradient(160deg, var(--primary-dark) 0%, var(--primary) 100%);
      padding: 60px 20px;
    }

    .section-depoimentos .section-label {
      color: rgba(255,255,255,0.7);
    }

    .section-depoimentos .section-title {
      color: var(--white);
    }

    .depoimentos-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 32px;
    }

    .depoimento-card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: var(--radius);
      padding: 24px;
    }

    .depoimento-stars {
      color: #ffd166;
      font-size: 1rem;
      margin-bottom: 12px;
      letter-spacing: 2px;
    }

    .depoimento-text {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.92);
      line-height: 1.7;
      margin-bottom: 16px;
      font-style: italic;
    }

    .depoimento-author {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .depoimento-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-weight: 700;
      font
