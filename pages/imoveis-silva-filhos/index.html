<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Imóveis Silva & Filhos — Corretor de imóveis em Curitiba, PR. Compra, venda e locação com quem conhece cada bairro da cidade.">
<title>Imóveis Silva & Filhos | Corretor de Imóveis em Curitiba</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --green: #27ae60;
    --green-dark: #1e8449;
    --green-light: #2ecc71;
    --bg: #eafaf1;
    --bg-white: #ffffff;
    --text-dark: #1a2e1f;
    --text-mid: #2d4a35;
    --text-soft: #5a7a62;
    --border: #c3e6ce;
    --shadow: 0 4px 24px rgba(39,174,96,0.10);
    --radius: 14px;
    --radius-sm: 8px;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background-color: var(--bg);
    color: var(--text-dark);
    line-height: 1.6;
    font-size: 16px;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    background: var(--bg-white);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(39,174,96,0.07);
  }

  .header-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .logo-icon {
    width: 40px;
    height: 40px;
    background: var(--green);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .logo-icon svg {
    width: 22px;
    height: 22px;
    fill: white;
  }

  .logo-text {
    display: flex;
    flex-direction: column;
    line-height: 1.15;
  }

  .logo-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-dark);
    letter-spacing: -0.2px;
  }

  .logo-sub {
    font-size: 11px;
    color: var(--text-soft);
    font-weight: 500;
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }

  .header-cta {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--green);
    color: white;
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    transition: background 0.2s, transform 0.15s;
  }

  .header-cta:hover {
    background: var(--green-dark);
    transform: translateY(-1px);
  }

  .header-cta svg {
    width: 16px;
    height: 16px;
    fill: white;
    flex-shrink: 0;
  }

  /* ── HERO ── */
  .hero {
    background: linear-gradient(145deg, #1a3d27 0%, #1e8449 55%, #27ae60 100%);
    color: white;
    padding: 64px 20px 72px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 60% at 50% 110%, rgba(255,255,255,0.06) 0%, transparent 70%),
      url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    pointer-events: none;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.25);
    color: #d5f5e3;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 50px;
    margin-bottom: 24px;
  }

  .hero-badge span {
    width: 6px;
    height: 6px;
    background: #2ecc71;
    border-radius: 50%;
    display: inline-block;
    animation: pulse 1.8s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.4); }
  }

  .hero h1 {
    font-size: clamp(26px, 6vw, 52px);
    font-weight: 800;
    line-height: 1.18;
    letter-spacing: -1px;
    margin-bottom: 20px;
    max-width: 760px;
    margin-left: auto;
    margin-right: auto;
  }

  .hero h1 em {
    font-style: normal;
    color: #a9dfbf;
    position: relative;
  }

  .hero-desc {
    font-size: clamp(15px, 3.5vw, 19px);
    color: rgba(255,255,255,0.82);
    max-width: 580px;
    margin: 0 auto 36px;
    line-height: 1.65;
  }

  .hero-actions {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    background: white;
    color: var(--green-dark);
    text-decoration: none;
    padding: 16px 32px;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 700;
    box-shadow: 0 6px 28px rgba(0,0,0,0.18);
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .btn-primary svg {
    width: 20px;
    height: 20px;
    fill: var(--green);
    flex-shrink: 0;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 36px rgba(0,0,0,0.22);
  }

  .hero-trust {
    font-size: 13px;
    color: rgba(255,255,255,0.55);
    display: flex;
    align-items: center;
    gap: 6px;
    justify-content: center;
  }

  .hero-trust::before {
    content: '🔒';
    font-size: 12px;
  }

  .hero-stats {
    display: flex;
    justify-content: center;
    gap: 0;
    margin-top: 52px;
    border-top: 1px solid rgba(255,255,255,0.15);
    padding-top: 32px;
    flex-wrap: wrap;
  }

  .stat-item {
    flex: 1;
    min-width: 100px;
    max-width: 180px;
    text-align: center;
    padding: 0 20px;
    position: relative;
  }

  .stat-item + .stat-item::before {
    content: '';
    position: absolute;
    left: 0;
    top: 10%;
    height: 80%;
    width: 1px;
    background: rgba(255,255,255,0.15);
  }

  .stat-number {
    font-size: clamp(24px, 5vw, 36px);
    font-weight: 800;
    color: white;
    display: block;
    line-height: 1.1;
  }

  .stat-label {
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    margin-top: 4px;
    font-weight: 500;
    line-height: 1.3;
  }

  /* ── PROBLEMA / OPORTUNIDADE ── */
  .problema {
    padding: 64px 20px;
    background: var(--bg-white);
  }

  .container {
    max-width: 960px;
    margin: 0 auto;
  }

  .section-label {
    text-transform: uppercase;
    letter-spacing: 1.2px;
    font-size: 11px;
    font-weight: 700;
    color: var(--green);
    margin-bottom: 10px;
  }

  .section-title {
    font-size: clamp(22px, 5vw, 36px);
    font-weight: 800;
    color: var(--text-dark);
    line-height: 1.25;
    letter-spacing: -0.5px;
    margin-bottom: 16px;
  }

  .section-sub {
    font-size: clamp(14px, 3vw, 17px);
    color: var(--text-soft);
    line-height: 1.7;
    max-width: 620px;
  }

  .problema-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    margin-top: 40px;
  }

  .problema-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }

  .problema-icon {
    width: 44px;
    height: 44px;
    background: white;
    border: 2px solid var(--border);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .problema-card h3 {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-dark);
    margin-bottom: 6px;
  }

  .problema-card p {
    font-size: 14px;
    color: var(--text-soft);
    line-height: 1.6;
  }

  /* ── SOBRE ── */
  .sobre {
    padding: 72px 20px;
    background: var(--bg);
  }

  .sobre-inner {
    max-width: 960px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr;
    gap: 48px;
    align-items: center;
  }

  .sobre-visual {
    position: relative;
  }

  .sobre-card-main {
    background: var(--bg-white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    box-shadow: var(--shadow);
  }

  .sobre-avatar {
    width: 72px;
    height: 72px;
    background: linear-gradient(135deg, var(--green-light), var(--green-dark));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
  }

  .sobre-avatar svg {
    width: 36px;
    height: 36px;
    fill: white;
  }

  .sobre-card-main h3 {
    font-size: 20px;
    font-weight: 800;
    color: var(--text-dark);
    margin-bottom: 6px;
  }

  .sobre-card-main .role {
    font-size: 13px;
    color: var(--green);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 16px;
  }

  .sobre-card-main p {
    font-size: 14px;
    color: var(--text-soft);
    line-height: 1.7;
  }

  .sobre-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 18px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text-mid);
    font-size: 12px;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 50px;
  }

  .badge-dot {
    width: 6px;
    height: 6px;
    background: var(--green);
    border-radius: 50%;
    flex-shrink: 0;
  }

  .sobre-content .section-sub {
    max-width: 100%;
    margin-bottom: 28px;
  }
