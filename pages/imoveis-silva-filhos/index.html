<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Imóveis Silva & Filhos — Corretores de imóveis em Curitiba, PR. Encontre seu imóvel ideal com quem conhece a cidade de verdade.">
<title>Imóveis Silva & Filhos | Corretora de Imóveis em Curitiba</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --green: #27ae60;
    --green-dark: #1e8449;
    --green-light: #2ecc71;
    --bg: #eafaf1;
    --white: #ffffff;
    --text-dark: #1a2e1f;
    --text-mid: #2d4a35;
    --text-soft: #4a7c59;
    --border: #c3e6cf;
    --shadow: rgba(39, 174, 96, 0.15);
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text-dark);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ── HEADER / NAV ── */
  header {
    background: var(--white);
    border-bottom: 2px solid var(--border);
    padding: 16px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px var(--shadow);
  }

  .header-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .logo-icon {
    width: 40px;
    height: 40px;
    background: var(--green);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .logo-icon svg {
    width: 22px;
    height: 22px;
    fill: var(--white);
  }

  .logo-text {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
  }

  .logo-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-dark);
    letter-spacing: -0.3px;
  }

  .logo-sub {
    font-size: 11px;
    color: var(--text-soft);
    font-weight: 500;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }

  .header-cta {
    background: var(--green);
    color: var(--white);
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    transition: background 0.2s ease, transform 0.1s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .header-cta:hover {
    background: var(--green-dark);
    transform: translateY(-1px);
  }

  .header-cta svg {
    width: 16px;
    height: 16px;
    fill: var(--white);
    flex-shrink: 0;
  }

  /* ── HERO ── */
  .hero {
    background: linear-gradient(135deg, #1a3a22 0%, #1e6b3a 45%, #27ae60 100%);
    color: var(--white);
    padding: 64px 20px 72px;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -80px;
    right: -80px;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    pointer-events: none;
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: -60px;
    left: -60px;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: rgba(255,255,255,0.03);
    pointer-events: none;
  }

  .hero-inner {
    max-width: 1100px;
    margin: 0 auto;
    position: relative;
    z-index: 2;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 24px;
    backdrop-filter: blur(8px);
  }

  .hero-badge::before {
    content: '📍';
    font-size: 13px;
  }

  .hero h1 {
    font-size: clamp(28px, 7vw, 52px);
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -0.8px;
    margin-bottom: 20px;
    max-width: 700px;
  }

  .hero h1 span {
    color: var(--green-light);
    position: relative;
  }

  .hero-subtitle {
    font-size: clamp(15px, 3.5vw, 18px);
    color: rgba(255,255,255,0.82);
    max-width: 580px;
    margin-bottom: 36px;
    line-height: 1.7;
    font-weight: 400;
  }

  .hero-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
  }

  .btn-whatsapp {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--white);
    color: var(--green-dark);
    text-decoration: none;
    padding: 16px 28px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }

  .btn-whatsapp:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(0,0,0,0.25);
  }

  .btn-whatsapp svg {
    width: 22px;
    height: 22px;
    fill: var(--green);
    flex-shrink: 0;
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: rgba(255,255,255,0.88);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    padding: 10px 4px;
    transition: color 0.2s ease;
  }

  .btn-secondary:hover {
    color: var(--white);
  }

  .btn-secondary::after {
    content: '↓';
    font-size: 16px;
  }

  .hero-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    margin-top: 52px;
    padding-top: 40px;
    border-top: 1px solid rgba(255,255,255,0.15);
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .stat-number {
    font-size: clamp(24px, 5vw, 32px);
    font-weight: 800;
    color: var(--green-light);
    line-height: 1;
  }

  .stat-label {
    font-size: 12px;
    color: rgba(255,255,255,0.65);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  /* ── ALERT / PROBLEMA ── */
  .alert-section {
    background: #fffbea;
    border-top: 3px solid #f39c12;
    border-bottom: 3px solid #f39c12;
    padding: 28px 20px;
  }

  .alert-inner {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }

  .alert-icon {
    font-size: 28px;
    flex-shrink: 0;
    line-height: 1;
    margin-top: 2px;
  }

  .alert-text strong {
    display: block;
    font-size: 16px;
    font-weight: 700;
    color: #7d5000;
    margin-bottom: 4px;
  }

  .alert-text p {
    font-size: 14px;
    color: #8a6000;
    line-height: 1.6;
  }

  /* ── SECTION COMMONS ── */
  section {
    padding: 72px 20px;
  }

  .section-inner {
    max-width: 1100px;
    margin: 0 auto;
  }

  .section-label {
    display: inline-block;
    background: var(--bg);
    color: var(--green-dark);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 14px;
  }

  .section-title {
    font-size: clamp(22px, 5vw, 36px);
    font-weight: 800;
    color: var(--text-dark);
    letter-spacing: -0.5px;
    line-height: 1.2;
    margin-bottom: 14px;
  }

  .section-desc {
    font-size: 16px;
    color: var(--text-soft);
    max-width: 560px;
    line-height: 1.7;
    margin-bottom: 48px;
  }

  /* ── SOBRE ── */
  .about-section {
    background: var(--white);
  }

  .about-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 40px;
    align-items: center;
  }

  @media (min-width: 768px) {
    .about-grid {
      grid-template-columns: 1fr 1fr;
      gap: 64px;
    }
  }

  .about-visual {
    background: linear-gradient(135deg, var(--bg) 0%, #d5f5e3 100%);
    border: 2px solid var(--border);
    border-radius: 20px;
    padding: 40px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    position: relative;
    overflow: hidden;
  }

  .about-visual::before {
    content: '';
    position: absolute;
    top: -30px;
    right: -30px;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: rgba(39, 174, 96, 0.08);
  }

  .about-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--green);
    color: var(--white);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    width: fit-content;
  }

  .about-card-stat {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .about-card-stat .big {
    font-size: 42px;
    font-weight: 800;
    color: var(--green-dark);
    line-height: 1;
  }

  .about-card-stat .small {
    font-size: 14px;
    color: var(--text-soft);
    font-weight: 500;
  }

  .about-divider {
    height: 1px;
    background: var(--border);
  }

  .about-quote {
    font-size: 15px;
    color: var(--text-mid);
    line-height: 1.6;
    font-style: italic;
  }

  .about-quote strong {
    color: var(--green-dark);
    font-style: normal;
  }

  .about-text .section-desc {
    margin-bottom: 24px;
  }

  .about-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .about-list li {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 15px;
    color: var(--text-mid);
    line-height: 1.5;
  }

  .check-icon {
    width: 20px;
    height: 20px;
    background: var(--green);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .check-icon svg {
    width: 11px;
    height: 11px;
    fill: var(--white);
  }

  /* ── SERVIÇOS ── */
  .services-section {
    background: var(--bg);
  }

  .services-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }

  @media (min-width: 600px) {
    .services-grid {
      grid-template-columns: 1fr 1fr;
    }
  }
