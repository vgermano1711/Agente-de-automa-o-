<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Construtora Horizonte em Campinas, SP. Construção residencial e comercial com qualidade comprovada. Solicite seu orçamento pelo WhatsApp.">
<title>Construtora Horizonte — Campinas, SP</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --primary: #e67e22;
    --primary-dark: #ca6f1e;
    --primary-light: #f0a355;
    --bg: #fef5e7;
    --bg-dark: #fdebd0;
    --text-dark: #1a1a1a;
    --text-mid: #3d3d3d;
    --text-light: #6b6b6b;
    --white: #ffffff;
    --border: #f0c98a;
    --shadow: 0 4px 24px rgba(230,126,34,0.13);
    --radius: 14px;
    --radius-sm: 8px;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
    background-color: var(--bg);
    color: var(--text-dark);
    line-height: 1.6;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }

  /* ── HEADER ── */
  header {
    background: var(--white);
    border-bottom: 2px solid var(--border);
    padding: 16px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
  }

  .header-inner {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .logo-icon {
    width: 42px;
    height: 42px;
    background: var(--primary);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .logo-icon svg {
    width: 24px;
    height: 24px;
    fill: var(--white);
  }

  .logo-text {
    display: flex;
    flex-direction: column;
    line-height: 1.2;
  }

  .logo-name {
    font-size: 17px;
    font-weight: 800;
    color: var(--text-dark);
    letter-spacing: -0.3px;
  }

  .logo-sub {
    font-size: 11px;
    color: var(--primary);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .header-cta {
    background: var(--primary);
    color: var(--white);
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    transition: background 0.2s, transform 0.1s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .header-cta:active {
    background: var(--primary-dark);
    transform: scale(0.97);
  }

  .header-cta svg {
    width: 16px;
    height: 16px;
    fill: var(--white);
    flex-shrink: 0;
  }

  /* ── HERO ── */
  .hero {
    background: linear-gradient(160deg, #1a1a1a 0%, #2d2d2d 60%, #3a2505 100%);
    color: var(--white);
    padding: 60px 20px 52px;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -60px;
    right: -60px;
    width: 280px;
    height: 280px;
    background: radial-gradient(circle, rgba(230,126,34,0.25) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: -80px;
    left: -40px;
    width: 220px;
    height: 220px;
    background: radial-gradient(circle, rgba(230,126,34,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-inner {
    max-width: 960px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(230,126,34,0.18);
    border: 1px solid rgba(230,126,34,0.4);
    color: var(--primary-light);
    font-size: 12px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 50px;
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 0.7px;
  }

  .hero-badge svg {
    width: 14px;
    height: 14px;
    fill: var(--primary-light);
  }

  .hero h1 {
    font-size: clamp(26px, 7vw, 48px);
    font-weight: 900;
    line-height: 1.15;
    letter-spacing: -0.5px;
    margin-bottom: 18px;
    max-width: 700px;
  }

  .hero h1 span {
    color: var(--primary);
  }

  .hero-desc {
    font-size: clamp(15px, 4vw, 18px);
    color: rgba(255,255,255,0.75);
    max-width: 560px;
    margin-bottom: 32px;
    line-height: 1.7;
  }

  .hero-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
  }

  .btn-primary {
    background: var(--primary);
    color: var(--white);
    text-decoration: none;
    padding: 16px 28px;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 800;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
    box-shadow: 0 6px 20px rgba(230,126,34,0.45);
  }

  .btn-primary:active {
    background: var(--primary-dark);
    transform: scale(0.97);
    box-shadow: 0 3px 10px rgba(230,126,34,0.3);
  }

  .btn-primary svg {
    width: 20px;
    height: 20px;
    fill: var(--white);
  }

  .btn-secondary {
    color: rgba(255,255,255,0.7);
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-bottom: 1px solid rgba(255,255,255,0.3);
    padding-bottom: 2px;
    transition: color 0.2s;
  }

  .btn-secondary:active {
    color: var(--primary-light);
  }

  .hero-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-top: 44px;
    padding-top: 32px;
    border-top: 1px solid rgba(255,255,255,0.1);
  }

  .stat-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .stat-number {
    font-size: 28px;
    font-weight: 900;
    color: var(--primary);
    line-height: 1;
  }

  .stat-label {
    font-size: 12px;
    color: rgba(255,255,255,0.55);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* ── SOCIAL PROOF BAR ── */
  .proof-bar {
    background: var(--primary);
    padding: 14px 20px;
    text-align: center;
  }

  .proof-bar-inner {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  .stars {
    display: inline-flex;
    gap: 2px;
  }

  .stars svg {
    width: 18px;
    height: 18px;
    fill: var(--white);
  }

  .proof-text {
    color: var(--white);
    font-size: 14px;
    font-weight: 700;
  }

  .proof-subtext {
    color: rgba(255,255,255,0.8);
    font-size: 13px;
  }

  /* ── SECTION BASE ── */
  section {
    padding: 64px 20px;
  }

  .section-inner {
    max-width: 960px;
    margin: 0 auto;
  }

  .section-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin-bottom: 10px;
  }

  .section-title {
    font-size: clamp(22px, 5.5vw, 36px);
    font-weight: 900;
    color: var(--text-dark);
    line-height: 1.2;
    margin-bottom: 14px;
    letter-spacing: -0.3px;
  }

  .section-desc {
    font-size: 16px;
    color: var(--text-light);
    max-width: 540px;
    line-height: 1.7;
  }

  /* ── SOBRE ── */
  .sobre {
    background: var(--white);
  }

  .sobre-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 48px;
    margin-top: 40px;
  }

  .sobre-text p {
    font-size: 16px;
    color: var(--text-mid);
    line-height: 1.8;
    margin-bottom: 16px;
  }

  .sobre-text p:last-child {
    margin-bottom: 0;
  }

  .sobre-text strong {
    color: var(--text-dark);
    font-weight: 700;
  }

  .sobre-visual {
    background: var(--bg);
    border-radius: var(--radius);
    padding: 32px 24px;
    border: 1px solid var(--border);
  }

  .sobre-visual-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 20px;
  }

  .processo-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .processo-item {
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }

  .processo-num {
    width: 32px;
    height: 32px;
    background: var(--primary);
    color: var(--white);
    border-radius: 50%;
    font-size: 13px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .processo-content h4 {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-dark);
    margin-bottom: 3px;
  }

  .processo-content p {
    font-size: 13px;
    color: var(--text-light);
    line-height: 1.5;
  }

  /* ── SERVIÇOS ── */
  .servicos {
    background: var(--bg);
  }

  .servicos-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    margin-top: 36px;
  }

  .servico-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 24px;
    border: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 18px;
    transition: box-shadow 0.2s, transform 0.2s;
  }

  .servico-card:active {
    box-shadow: var(--shadow);
    transform: translateY(-2px);
  }

  .servico-icon {
    width: 52px;
    height: 52px;
    background: linear-gradient(135deg, #fef5e7, #fdebd0);
    border-radius: 12px;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .servico-icon svg {
    width: 26px;
    height: 26px;
    fill: var(--primary);
  }

  .servico-info h3 {
    font-size: 17px;
    font-weight: 800;
    color: var(--text-dark);
    margin-bottom: 6px;
    letter-spacing: -0.2px;
  }

  .servico-info p {
    font-size: 14px;
    color: var(--text-light);
    line-height: 1.6;
  }

  /* ── DIFERENCIAIS ── */
  .diferenciais {
    background: linear-gradient(160deg, #1a1a1a 0%, #2d2d2d 100%);
    color: var(--white);
    position:
