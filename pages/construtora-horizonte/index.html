<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Construtora Horizonte — Campinas, SP</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --primary: #e67e22;
    --primary-dark: #ca6f1e;
    --primary-light: #f39c12;
    --bg: #fef5e7;
    --bg-dark: #fdebd0;
    --text-dark: #1a1a1a;
    --text-mid: #3d3d3d;
    --text-light: #6b6b6b;
    --white: #ffffff;
    --shadow: 0 4px 24px rgba(230,126,34,0.13);
    --radius: 12px;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background-color: var(--bg);
    color: var(--text-dark);
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* ===== HEADER / NAV ===== */
  header {
    background: var(--white);
    border-bottom: 3px solid var(--primary);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }

  .nav-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .logo-icon {
    width: 40px;
    height: 40px;
    background: var(--primary);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .logo-icon svg {
    width: 24px;
    height: 24px;
    fill: var(--white);
  }

  .logo-text {
    display: flex;
    flex-direction: column;
    line-height: 1.2;
  }

  .logo-name {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-dark);
    letter-spacing: -0.3px;
  }

  .logo-city {
    font-size: 0.7rem;
    color: var(--primary);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .nav-cta {
    background: var(--primary);
    color: var(--white);
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.82rem;
    font-weight: 700;
    white-space: nowrap;
    transition: background 0.2s, transform 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .nav-cta:hover {
    background: var(--primary-dark);
    transform: translateY(-1px);
  }

  /* ===== HERO ===== */
  .hero {
    background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1f1f1f 100%);
    position: relative;
    overflow: hidden;
    padding: 64px 20px 72px;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: 
      radial-gradient(ellipse at 80% 20%, rgba(230,126,34,0.18) 0%, transparent 60%),
      radial-gradient(ellipse at 10% 80%, rgba(230,126,34,0.10) 0%, transparent 50%);
    pointer-events: none;
  }

  .hero-pattern {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    opacity: 0.04;
    background-image: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 30px,
      rgba(255,255,255,0.5) 30px,
      rgba(255,255,255,0.5) 31px
    ),
    repeating-linear-gradient(
      90deg,
      transparent,
      transparent 30px,
      rgba(255,255,255,0.5) 30px,
      rgba(255,255,255,0.5) 31px
    );
    pointer-events: none;
  }

  .hero-inner {
    max-width: 1100px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(230,126,34,0.15);
    border: 1px solid rgba(230,126,34,0.4);
    color: var(--primary-light);
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 6px 14px;
    border-radius: 50px;
    margin-bottom: 24px;
  }

  .hero-badge span {
    width: 6px;
    height: 6px;
    background: var(--primary-light);
    border-radius: 50%;
    display: inline-block;
  }

  .hero h1 {
    font-size: clamp(1.7rem, 5vw, 2.9rem);
    font-weight: 800;
    color: var(--white);
    line-height: 1.2;
    margin-bottom: 20px;
    letter-spacing: -0.5px;
  }

  .hero h1 em {
    font-style: normal;
    color: var(--primary);
  }

  .hero-sub {
    font-size: clamp(0.95rem, 2.5vw, 1.1rem);
    color: rgba(255,255,255,0.72);
    max-width: 560px;
    margin-bottom: 36px;
    line-height: 1.7;
  }

  .hero-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--primary);
    color: var(--white);
    text-decoration: none;
    padding: 16px 28px;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 6px 20px rgba(230,126,34,0.35);
  }

  .btn-primary:hover {
    background: var(--primary-dark);
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(230,126,34,0.45);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: rgba(255,255,255,0.75);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 600;
    transition: color 0.2s;
  }

  .btn-secondary:hover {
    color: var(--white);
  }

  .hero-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 28px;
    margin-top: 52px;
    padding-top: 36px;
    border-top: 1px solid rgba(255,255,255,0.1);
  }

  .hero-stat {
    display: flex;
    flex-direction: column;
  }

  .hero-stat-num {
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--primary);
    line-height: 1;
  }

  .hero-stat-label {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.55);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* ===== SOBRE ===== */
  .sobre {
    padding: 72px 20px;
    background: var(--white);
  }

  .section-inner {
    max-width: 1100px;
    margin: 0 auto;
  }

  .section-label {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--primary);
    margin-bottom: 10px;
  }

  .section-title {
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 800;
    color: var(--text-dark);
    line-height: 1.25;
    margin-bottom: 16px;
    letter-spacing: -0.3px;
  }

  .section-desc {
    font-size: 1rem;
    color: var(--text-light);
    max-width: 580px;
    line-height: 1.75;
    margin-bottom: 48px;
  }

  .sobre-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 28px;
  }

  @media (min-width: 600px) {
    .sobre-grid {
      grid-template-columns: 1fr 1fr;
    }
  }

  @media (min-width: 900px) {
    .sobre-grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  .servico-card {
    background: var(--bg);
    border: 1px solid rgba(230,126,34,0.15);
    border-radius: var(--radius);
    padding: 28px 24px;
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    position: relative;
    overflow: hidden;
  }

  .servico-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--primary);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.3s;
  }

  .servico-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow);
    border-color: rgba(230,126,34,0.3);
  }

  .servico-card:hover::before {
    transform: scaleX(1);
  }

  .servico-icon {
    width: 48px;
    height: 48px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
  }

  .servico-icon svg {
    width: 26px;
    height: 26px;
    fill: var(--white);
  }

  .servico-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-dark);
    margin-bottom: 8px;
  }

  .servico-desc {
    font-size: 0.875rem;
    color: var(--text-light);
    line-height: 1.65;
  }

  /* ===== DIFERENCIAIS ===== */
  .diferenciais {
    padding: 72px 20px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }

  .diferenciais::after {
    content: '';
    position: absolute;
    right: -80px;
    top: -80px;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(230,126,34,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .dif-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
    margin-top: 48px;
  }

  @media (min-width: 720px) {
    .dif-grid {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  .dif-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 36px 28px;
    text-align: center;
    box-shadow: 0 2px 16px rgba(0,0,0,0.06);
    border: 1px solid rgba(0,0,0,0.06);
    transition: transform 0.2s, box-shadow 0.2s;
    position: relative;
    z-index: 1;
  }

  .dif-card:hover {
    transform: translateY(-5px);
    box-shadow: var(--shadow);
  }

  .dif-num {
    font-size: 2.8rem;
    font-weight: 900;
    color: var(--primary);
    line-height: 1;
    margin-bottom: 6px;
    letter-spacing: -1px;
  }

  .dif-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-dark);
    margin-bottom: 10px;
  }

  .dif-desc {
    font-size: 0.875rem;
    color: var(--text-light);
    line-height: 1.65;
  }

  /* ===== DEPOIMENTO ===== */
  .depoimento {
    padding: 64px 20px;
    background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
    position: relative;
    overflow: hidden;
  }

  .depoimento::before {
    content: '"';
    position: absolute;
    top: -20px;
    left: 20px;
    font-size: 18rem;
    color: rgba(230,126,34,0.07);
    font-family: Georgia, serif;
    line-height: 1;
    pointer-events: none;
  }

  .depoimento-inner {
    max-width: 760px;
    margin:
