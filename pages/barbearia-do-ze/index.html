<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Barbearia do Zé — Cortes, barbas e estilo em São Paulo, SP. Agende seu horário agora pelo WhatsApp.">
<title>Barbearia do Zé | São Paulo, SP</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --primary: #2c3e50;
    --primary-light: #3d5166;
    --primary-dark: #1a252f;
    --bg: #ecf0f1;
    --accent: #e67e22;
    --accent-hover: #cf6d17;
    --white: #ffffff;
    --text-dark: #1a1a2e;
    --text-muted: #5a6a7a;
    --text-light: #8fa3b1;
    --whatsapp: #25d366;
    --whatsapp-hover: #1da851;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
    --shadow-md: 0 4px 20px rgba(0,0,0,0.12);
    --shadow-lg: 0 8px 40px rgba(0,0,0,0.18);
    --radius: 12px;
    --radius-sm: 8px;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background-color: var(--bg);
    color: var(--text-dark);
    line-height: 1.6;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }

  /* ─── HEADER / NAV ─── */
  header {
    background-color: var(--primary-dark);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow-md);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .logo-icon {
    width: 38px;
    height: 38px;
    background: var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .logo-text {
    color: var(--white);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.3px;
    line-height: 1.2;
  }

  .logo-text span {
    display: block;
    font-size: 11px;
    font-weight: 400;
    color: var(--text-light);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .header-cta {
    background: var(--whatsapp);
    color: var(--white);
    text-decoration: none;
    padding: 9px 16px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s, transform 0.1s;
    white-space: nowrap;
  }

  .header-cta:hover {
    background: var(--whatsapp-hover);
    transform: scale(1.03);
  }

  /* ─── HERO ─── */
  .hero {
    background: linear-gradient(155deg, var(--primary-dark) 0%, var(--primary) 55%, #2e4057 100%);
    padding: 60px 20px 70px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -60px;
    right: -60px;
    width: 220px;
    height: 220px;
    background: rgba(230,126,34,0.08);
    border-radius: 50%;
    pointer-events: none;
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: -80px;
    left: -40px;
    width: 280px;
    height: 280px;
    background: rgba(255,255,255,0.03);
    border-radius: 50%;
    pointer-events: none;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(230,126,34,0.15);
    border: 1px solid rgba(230,126,34,0.35);
    color: #f0a05a;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 50px;
    margin-bottom: 24px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .hero h1 {
    color: var(--white);
    font-size: clamp(26px, 7vw, 44px);
    font-weight: 800;
    line-height: 1.2;
    margin-bottom: 20px;
    letter-spacing: -0.5px;
  }

  .hero h1 em {
    font-style: normal;
    color: var(--accent);
  }

  .hero p {
    color: rgba(255,255,255,0.75);
    font-size: clamp(15px, 4vw, 18px);
    max-width: 480px;
    margin: 0 auto 36px;
    line-height: 1.7;
  }

  .hero-btns {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
  }

  .btn-primary {
    background: var(--whatsapp);
    color: var(--white);
    text-decoration: none;
    padding: 16px 32px;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 4px 20px rgba(37,211,102,0.35);
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    width: 100%;
    max-width: 340px;
    justify-content: center;
  }

  .btn-primary:hover {
    background: var(--whatsapp-hover);
    transform: translateY(-2px);
    box-shadow: 0 6px 28px rgba(37,211,102,0.45);
  }

  .btn-secondary {
    color: rgba(255,255,255,0.7);
    text-decoration: none;
    font-size: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.3);
    padding-bottom: 2px;
    transition: color 0.2s;
  }

  .btn-secondary:hover {
    color: var(--white);
  }

  .hero-stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-top: 48px;
    padding-top: 32px;
    border-top: 1px solid rgba(255,255,255,0.1);
    flex-wrap: wrap;
  }

  .stat {
    text-align: center;
  }

  .stat-num {
    color: var(--white);
    font-size: 26px;
    font-weight: 800;
    display: block;
    line-height: 1;
  }

  .stat-label {
    color: rgba(255,255,255,0.55);
    font-size: 12px;
    margin-top: 4px;
    letter-spacing: 0.5px;
  }

  .stat-stars {
    color: #f1c40f;
    font-size: 14px;
    letter-spacing: 1px;
  }

  /* ─── SECTION BASE ─── */
  section {
    padding: 60px 20px;
  }

  .section-label {
    display: inline-block;
    background: rgba(44,62,80,0.08);
    color: var(--primary);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 50px;
    margin-bottom: 14px;
    border-left: 3px solid var(--accent);
  }

  .section-title {
    font-size: clamp(22px, 5.5vw, 34px);
    font-weight: 800;
    color: var(--primary-dark);
    line-height: 1.25;
    margin-bottom: 14px;
    letter-spacing: -0.3px;
  }

  .section-title em {
    font-style: normal;
    color: var(--accent);
  }

  .section-sub {
    color: var(--text-muted);
    font-size: 15px;
    line-height: 1.7;
    max-width: 500px;
  }

  /* ─── SOBRE ─── */
  .sobre {
    background: var(--white);
  }

  .sobre-inner {
    max-width: 700px;
    margin: 0 auto;
  }

  .sobre-card {
    background: var(--bg);
    border-radius: var(--radius);
    padding: 24px;
    margin-top: 32px;
    display: flex;
    align-items: flex-start;
    gap: 16px;
    border-left: 4px solid var(--accent);
  }

  .sobre-card-icon {
    font-size: 28px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .sobre-card p {
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.7;
  }

  .sobre-card strong {
    color: var(--primary-dark);
    display: block;
    font-size: 15px;
    margin-bottom: 4px;
  }

  /* ─── SERVIÇOS ─── */
  .servicos {
    background: var(--bg);
  }

  .servicos-inner {
    max-width: 700px;
    margin: 0 auto;
  }

  .servicos-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-top: 32px;
  }

  .servico-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 20px 16px;
    text-align: center;
    box-shadow: var(--shadow-sm);
    transition: transform 0.2s, box-shadow 0.2s;
    border-bottom: 3px solid transparent;
  }

  .servico-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-md);
    border-bottom-color: var(--accent);
  }

  .servico-emoji {
    font-size: 32px;
    display: block;
    margin-bottom: 10px;
  }

  .servico-name {
    font-weight: 700;
    font-size: 14px;
    color: var(--primary-dark);
    margin-bottom: 4px;
  }

  .servico-desc {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .servico-preco {
    display: inline-block;
    margin-top: 10px;
    background: rgba(44,62,80,0.07);
    color: var(--primary);
    font-size: 12px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 50px;
  }

  /* ─── DIFERENCIAIS ─── */
  .diferenciais {
    background: var(--primary);
    position: relative;
    overflow: hidden;
  }

  .diferenciais::before {
    content: '';
    position: absolute;
    top: 0;
    right: -100px;
    width: 300px;
    height: 300px;
    background: rgba(255,255,255,0.03);
    border-radius: 50%;
    pointer-events: none;
  }

  .diferenciais .section-label {
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.8);
    border-left-color: var(--accent);
  }

  .diferenciais .section-title {
    color: var(--white);
  }

  .diferenciais .section-sub {
    color: rgba(255,255,255,0.65);
  }

  .diferenciais-inner {
    max-width: 700px;
    margin: 0 auto;
  }

  .diferenciais-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-top: 36px;
  }

  .diferencial-item {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: var(--radius);
    padding: 24px 20px;
    display: flex;
    gap: 18px;
    align-items: flex-start;
    transition: background 0.2s;
  }

  .diferencial-item:hover {
    background: rgba(255,255,255,0.1);
  }

  .diferencial-icon {
    width: 48px;
    height: 48px;
    border-radius: var(--radius-sm);
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }

  .diferencial-body h3 {
    color: var(--white);
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .diferencial-body p {
    color: rgba(255,255,255,0.65);
    font-size: 14px;
    line-height: 1.6;
  }

  /* ─── DEPOIMENTOS ─── */
  .depoimentos {
    background: var(--white);
  }

  .depoimentos-inner {
    max-width: 700px;
    margin: 0 auto;
  }

  .depoimentos-grid {
