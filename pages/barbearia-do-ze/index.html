<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Barbearia do Zé — Cortes precisos, atendimento de respeito em São Paulo, SP. Agende seu horário agora pelo WhatsApp.">
  <title>Barbearia do Zé | São Paulo, SP</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #2c3e50;
      --primary-light: #3d5166;
      --accent: #c0a060;
      --accent-light: #d4b47a;
      --bg: #ecf0f1;
      --bg-dark: #dde1e2;
      --white: #ffffff;
      --text-dark: #1a252f;
      --text-mid: #4a5a6a;
      --text-light: #7f8c8d;
      --whatsapp: #25d366;
      --whatsapp-dark: #1ebe5d;
      --radius: 10px;
      --shadow: 0 4px 24px rgba(44,62,80,0.13);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-dark);
      line-height: 1.6;
      font-size: 16px;
    }

    /* ── HEADER / NAV ── */
    header {
      background-color: var(--primary);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background-color: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .logo-text {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    .logo-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--white);
      letter-spacing: 0.3px;
    }

    .logo-sub {
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 500;
    }

    .header-cta {
      background-color: var(--whatsapp);
      color: var(--white);
      text-decoration: none;
      padding: 9px 16px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.2s;
      white-space: nowrap;
    }

    .header-cta:hover {
      background-color: var(--whatsapp-dark);
    }

    /* ── HERO ── */
    .hero {
      background: linear-gradient(160deg, var(--primary) 0%, var(--primary-light) 55%, #1a2a3a 100%);
      color: var(--white);
      padding: 64px 24px 72px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -60px;
      width: 260px;
      height: 260px;
      background: rgba(192,160,96,0.08);
      border-radius: 50%;
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: -80px;
      left: -40px;
      width: 200px;
      height: 200px;
      background: rgba(192,160,96,0.06);
      border-radius: 50%;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: rgba(192,160,96,0.18);
      border: 1px solid rgba(192,160,96,0.4);
      color: var(--accent-light);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 50px;
      margin-bottom: 24px;
    }

    .hero h1 {
      font-size: clamp(28px, 8vw, 46px);
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 20px;
      letter-spacing: -0.5px;
    }

    .hero h1 em {
      font-style: normal;
      color: var(--accent);
    }

    .hero p {
      font-size: clamp(15px, 4vw, 18px);
      color: rgba(255,255,255,0.82);
      max-width: 520px;
      margin: 0 auto 36px;
      line-height: 1.65;
    }

    .hero-buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: var(--whatsapp);
      color: var(--white);
      text-decoration: none;
      padding: 16px 32px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 700;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 6px 24px rgba(37,211,102,0.35);
      transition: background-color 0.2s, transform 0.15s, box-shadow 0.2s;
    }

    .btn-primary:hover {
      background-color: var(--whatsapp-dark);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(37,211,102,0.45);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .btn-secondary:hover {
      color: var(--accent);
    }

    .hero-social-proof {
      margin-top: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .proof-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: rgba(255,255,255,0.7);
    }

    .proof-item span.icon {
      font-size: 18px;
    }

    .proof-divider {
      width: 1px;
      height: 24px;
      background: rgba(255,255,255,0.2);
    }

    /* ── SOBRE ── */
    .section {
      padding: 64px 24px;
    }

    .section-label {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .section-title {
      font-size: clamp(22px, 6vw, 32px);
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 14px;
      line-height: 1.2;
    }

    .section-subtitle {
      font-size: 15px;
      color: var(--text-mid);
      max-width: 560px;
      line-height: 1.7;
      margin-bottom: 36px;
    }

    .sobre {
      background-color: var(--white);
    }

    .sobre-inner {
      max-width: 680px;
      margin: 0 auto;
    }

    .sobre-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-top: 32px;
    }

    .sobre-card {
      background-color: var(--bg);
      border-radius: var(--radius);
      padding: 22px 20px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      border-left: 4px solid var(--accent);
    }

    .sobre-card-icon {
      font-size: 28px;
      flex-shrink: 0;
      line-height: 1;
      margin-top: 2px;
    }

    .sobre-card-text h3 {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .sobre-card-text p {
      font-size: 14px;
      color: var(--text-mid);
      line-height: 1.55;
    }

    /* ── SERVIÇOS ── */
    .servicos {
      background-color: var(--bg);
    }

    .servicos-inner {
      max-width: 720px;
      margin: 0 auto;
    }

    .servicos-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .servico-card {
      background-color: var(--white);
      border-radius: var(--radius);
      padding: 20px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .servico-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 32px rgba(44,62,80,0.16);
    }

    .servico-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .servico-emoji {
      font-size: 28px;
      width: 48px;
      height: 48px;
      background-color: rgba(192,160,96,0.12);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .servico-info h3 {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 3px;
    }

    .servico-info p {
      font-size: 13px;
      color: var(--text-light);
    }

    .servico-price {
      text-align: right;
    }

    .price-value {
      font-size: 18px;
      font-weight: 800;
      color: var(--accent);
      display: block;
    }

    .price-label {
      font-size: 11px;
      color: var(--text-light);
    }

    /* ── DIFERENCIAIS ── */
    .diferenciais {
      background-color: var(--primary);
      color: var(--white);
    }

    .diferenciais-inner {
      max-width: 720px;
      margin: 0 auto;
    }

    .diferenciais .section-title {
      color: var(--white);
    }

    .diferenciais .section-subtitle {
      color: rgba(255,255,255,0.7);
    }

    .diferenciais-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .diferencial-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius);
      padding: 28px 22px;
      text-align: center;
      transition: background 0.2s, border-color 0.2s;
    }

    .diferencial-card:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(192,160,96,0.4);
    }

    .diferencial-icon {
      font-size: 40px;
      margin-bottom: 14px;
      display: block;
    }

    .diferencial-card h3 {
      font-size: 17px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .diferencial-card p {
      font-size: 14px;
      color: rgba(255,255,255,0.72);
      line-height: 1.6;
    }

    /* ── DEPOIMENTOS ── */
    .depoimentos {
      background-color: var(--white);
    }

    .depoimentos-inner {
      max-width: 720px;
      margin: 0 auto;
    }

    .depoimentos-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .depoimento-card {
      background-color: var(--bg);
      border-radius: var(--radius);
      padding: 22px 20px;
      position: relative;
    }

    .depoimento-card::before {
      content: '"';
      font-size: 64px;
      color: var(--accent);
      opacity: 0.25;
      position: absolute;
      top: 8px;
      left: 16px;
      line-height: 1;
      font-family: Georgia, serif;
    }

    .depoimento-stars {
      display: flex;
      gap: 3px;
      margin-bottom: 10px;
    }

    .star {
      color: #f39c12;
      font-size: 14px;
    }

    .depoimento-text {
      font-size: 14px;
      color: var(--text-mid);
      line-height: 1.65;
      margin-bottom: 14px;
      font-style: italic;
    }
