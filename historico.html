<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Histórico de Leads Acionados</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

    header { background: #1e293b; border-bottom: 1px solid #334155; padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 20px; font-weight: 700; color: #f1f5f9; }
    header nav a { color: #94a3b8; text-decoration: none; font-size: 14px; margin-left: 20px; }
    header nav a:hover { color: #e2e8f0; }

    .stats-bar { background: #1e293b; border-bottom: 1px solid #334155; padding: 14px 32px; display: flex; gap: 32px; flex-wrap: wrap; }
    .stat { font-size: 13px; color: #94a3b8; }
    .stat strong { color: #f1f5f9; font-size: 20px; display: block; font-weight: 700; }

    .toolbar { padding: 20px 32px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .toolbar input, .toolbar select { background: #1e293b; border: 1px solid #334155; color: #e2e8f0; padding: 8px 12px; border-radius: 8px; font-size: 13px; outline: none; }
    .toolbar input { width: 240px; }
    .toolbar input::placeholder { color: #64748b; }
    .toolbar select:focus, .toolbar input:focus { border-color: #3b82f6; }
    .count { margin-left: auto; font-size: 13px; color: #64748b; }

    .table-wrap { padding: 0 32px 32px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th { background: #1e293b; color: #94a3b8; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: .05em; padding: 10px 14px; text-align: left; border-bottom: 1px solid #334155; position: sticky; top: 0; cursor: pointer; white-space: nowrap; user-select: none; }
    thead th:hover { color: #e2e8f0; }
    thead th .sort-icon { opacity: .4; margin-left: 4px; }
    thead th.asc .sort-icon::after { content: '▲'; }
    thead th.desc .sort-icon::after { content: '▼'; }
    thead th:not(.asc):not(.desc) .sort-icon::after { content: '⇅'; }

    tbody tr { border-bottom: 1px solid #1e293b; transition: background .1s; }
    tbody tr:hover { background: #1e293b; }
    td { padding: 10px 14px; color: #cbd5e1; vertical-align: middle; }

    .nome { color: #f1f5f9; font-weight: 500; max-width: 260px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .badge-macro { background: #1e3a5f; color: #60a5fa; }
    .badge-micro { background: #1a2e1a; color: #4ade80; }
    .badge-canal { background: #2d1b4e; color: #a78bfa; }
    .badge-enviado { background: #1a2e1a; color: #4ade80; }
    .badge-probe { background: #1e2d1e; color: #86efac; }
    .badge-falha  { background: #2d1b1b; color: #f87171; }

    .data { white-space: nowrap; color: #64748b; font-size: 12px; }
    .telefone { font-family: monospace; font-size: 12px; color: #94a3b8; }
    .cidade { color: #94a3b8; }

    .empty { text-align: center; padding: 64px; color: #475569; }
    .empty svg { opacity: .3; margin-bottom: 12px; }
    .empty p { font-size: 15px; }

    @media (max-width: 768px) {
      .stats-bar { gap: 16px; padding: 14px 16px; }
      .toolbar { padding: 16px; }
      .table-wrap { padding: 0 16px 16px; }
      header { padding: 16px; }
    }
  </style>
</head>
<body>

<header>
  <h1>Histórico de Leads Acionados</h1>
  <nav>
    <a href="/dashboard">Dashboard</a>
    <a href="/">Painel</a>
  </nav>
</header>

<div class="stats-bar" id="statsBar">
  <div class="stat"><strong id="totalCount">—</strong>Total acionados</div>
  <div class="stat"><strong id="hojeCount">—</strong>Acionados hoje</div>
  <div class="stat"><strong id="semanaCount">—</strong>Últimos 7 dias</div>
  <div class="stat"><strong id="segCount">—</strong>Segmentos distintos</div>
</div>

<div class="toolbar">
  <input type="text" id="search" placeholder="Buscar por nome, cidade, segmento..." />
  <select id="filtroMacro">
    <option value="">Todos os segmentos</option>
  </select>
  <select id="filtroCanal">
    <option value="">Todos os canais</option>
    <option value="whatsapp">WhatsApp</option>
    <option value="email">Email</option>
  </select>
  <select id="filtroStatus">
    <option value="">Todos os status</option>
    <option value="probe_enviado">Probe enviado</option>
    <option value="enviado">Enviado</option>
  </select>
  <span class="count" id="resultCount"></span>
</div>

<div class="table-wrap">
  <table id="tabela">
    <thead>
      <tr>
        <th data-col="nome_negocio">Negócio <span class="sort-icon"></span></th>
        <th data-col="segmento_macro">Segmento <span class="sort-icon"></span></th>
        <th data-col="segmento_micro">Micro <span class="sort-icon"></span></th>
        <th data-col="cidade">Cidade <span class="sort-icon"></span></th>
        <th data-col="canal">Canal <span class="sort-icon"></span></th>
        <th data-col="status_envio">Status <span class="sort-icon"></span></th>
        <th data-col="data_acionado">Data <span class="sort-icon"></span></th>
        <th data-col="telefone">Telefone <span class="sort-icon"></span></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">
    <p>Nenhum contato encontrado com os filtros aplicados.</p>
  </div>
</div>

<script>
  let todos = [];
  let sortCol = 'data_acionado';
  let sortDir = 'desc';

  async function carregar() {
    const res = await fetch('/api/historico');
    todos = await res.json();
    todos.sort((a, b) => new Date(b.data_acionado) - new Date(a.data_acionado));
    popularFiltros();
    atualizarStats();
    renderizar();
  }

  function popularFiltros() {
    const macros = [...new Set(todos.map(h => h.segmento_macro).filter(Boolean))].sort();
    const sel = document.getElementById('filtroMacro');
    macros.forEach(m => {
      const o = document.createElement('option');
      o.value = m; o.textContent = m;
      sel.appendChild(o);
    });
  }

  function atualizarStats() {
    const hoje = new Date().toISOString().slice(0, 10);
    const semanaAtras = new Date(Date.now() - 7 * 86400000).toISOString().slice(0, 10);
    document.getElementById('totalCount').textContent = todos.length;
    document.getElementById('hojeCount').textContent = todos.filter(h => h.data_acionado.startsWith(hoje)).length;
    document.getElementById('semanaCount').textContent = todos.filter(h => h.data_acionado >= semanaAtras).length;
    document.getElementById('segCount').textContent = new Set(todos.map(h => h.segmento_micro).filter(Boolean)).size;
  }

  function filtrar() {
    const q = document.getElementById('search').value.toLowerCase();
    const macro = document.getElementById('filtroMacro').value;
    const canal = document.getElementById('filtroCanal').value;
    const status = document.getElementById('filtroStatus').value;

    return todos.filter(h => {
      const texto = [h.nome_negocio, h.cidade, h.segmento_macro, h.segmento_nivel2, h.segmento_micro].join(' ').toLowerCase();
      return (!q || texto.includes(q))
        && (!macro || h.segmento_macro === macro)
        && (!canal || h.canal === canal)
        && (!status || h.status_envio === status);
    });
  }

  function ordenar(lista) {
    return [...lista].sort((a, b) => {
      let va = a[sortCol] || '', vb = b[sortCol] || '';
      if (sortCol === 'data_acionado') { va = new Date(va); vb = new Date(vb); }
      if (va < vb) return sortDir === 'asc' ? -1 : 1;
      if (va > vb) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });
  }

  function statusBadge(s) {
    if (s === 'probe_enviado') return `<span class="badge badge-probe">Probe</span>`;
    if (s === 'enviado') return `<span class="badge badge-enviado">Enviado</span>`;
    return `<span class="badge badge-falha">${s}</span>`;
  }

  function formatData(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  function renderizar() {
    const lista = ordenar(filtrar());
    const tbody = document.getElementById('tbody');
    const empty = document.getElementById('empty');
    document.getElementById('resultCount').textContent = `${lista.length} resultado(s)`;

    if (lista.length === 0) {
      tbody.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    tbody.innerHTML = lista.map(h => `
      <tr>
        <td class="nome">${h.nome_negocio || '—'}</td>
        <td><span class="badge badge-macro">${h.segmento_macro || '—'}</span></td>
        <td><span class="badge badge-micro">${h.segmento_micro || '—'}</span></td>
        <td class="cidade">${h.cidade || '—'}</td>
        <td><span class="badge badge-canal">${h.canal || '—'}</span></td>
        <td>${statusBadge(h.status_envio)}</td>
        <td class="data">${formatData(h.data_acionado)}</td>
        <td class="telefone">${h.telefone || '—'}</td>
      </tr>
    `).join('');
  }

  // Sort on header click
  document.querySelectorAll('thead th[data-col]').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (sortCol === col) {
        sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        sortCol = col; sortDir = 'asc';
      }
      document.querySelectorAll('thead th').forEach(t => t.classList.remove('asc', 'desc'));
      th.classList.add(sortDir);
      renderizar();
    });
  });

  // Filters
  ['search', 'filtroMacro', 'filtroCanal', 'filtroStatus'].forEach(id => {
    document.getElementById(id).addEventListener('input', renderizar);
    document.getElementById(id).addEventListener('change', renderizar);
  });

  // Set initial sort indicator
  document.querySelector(`th[data-col="${sortCol}"]`)?.classList.add(sortDir);

  carregar();
</script>
</body>
</html>
